openapi: 3.0.3
info:
  title: Movie Reservation API
  version: 1.0.0
  description: |
    Backend for a cinema ticketing service built with **Go, PostgreSQL and Redis**.

    ### Booking flow
    1. `GET /showtimes?date=` to browse the day's schedule
    2. `GET /showtimes/{id}/seats` to see the live seat map
    3. `POST /showtimes/{id}/holds` to hold seats for 5 minutes while checking out
    4. `POST /reservations` with an `Idempotency-Key` header to confirm the booking

    ### Guarantees
    - **No overbooking**: atomic Redis holds, backed by a Postgres partial unique index
    - **No double-scheduled halls**: a Postgres `EXCLUDE USING gist` constraint
    - **Safe retries**: idempotent booking through `Idempotency-Key`

    All money values are integer **cents**. All timestamps are RFC 3339.
    Errors always use the shape `{"error":{"code","message"}}`.
  contact:
    name: Dattatray Fadte
    email: dattatrayfadte@gmail.com
servers:
  - url: /api/v1
    description: This server

tags:
  - name: Auth
    description: Sign up and log in to get a JWT bearer token
  - name: Catalogue
    description: Public movie, genre and hall browsing
  - name: Showtimes
    description: Daily schedule and live seat maps
  - name: Booking
    description: Seat holds, reservations and cancellation
  - name: Admin · Users
    description: User management (admin only)
  - name: Admin · Catalogue
    description: Manage movies, halls and showtimes (admin only)
  - name: Admin · Reservations & Reports
    description: All reservations, capacity, occupancy and revenue (admin only)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the `access_token` from `POST /auth/login`, or use the login box at the top of this page.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      example: 1
    ReservationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    From:
      name: from
      in: query
      description: Inclusive start date in the theater timezone (default 30 days ago)
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Inclusive end date in the theater timezone (default 30 days ahead)
      schema: { type: string, format: date }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: invalid_argument, message: "select between 1 and 10 seats" } }
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthenticated, message: "missing bearer token" } }
    Forbidden:
      description: Authenticated but not allowed (admin role required)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: permission_denied, message: "requires admin role" } }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "showtime not found" } }
    Conflict:
      description: Business rule conflict (seat taken, overlapping showtime, ...)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: "seat 12 is currently held by another customer" } }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the window resets }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "too many requests, retry later" } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [invalid_argument, unauthenticated, permission_denied, not_found, conflict, rate_limited, method_not_allowed, internal]
            message: { type: string }

    Role:
      type: string
      enum: [user, admin]

    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 2 }
        email: { type: string, format: email, example: jane@example.com }
        name: { type: string, example: Jane Doe }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }

    SignupInput:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email, example: jane@example.com }
        name: { type: string, minLength: 1, maxLength: 100, example: Jane Doe }
        password: { type: string, format: password, minLength: 8, maxLength: 72, example: password123 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@cinema.local }
        password: { type: string, format: password, example: Admin@12345 }

    Session:
      type: object
      properties:
        access_token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    RoleInput:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }

    Genre:
      type: object
      properties:
        id: { type: integer, example: 8 }
        name: { type: string, example: Sci-Fi }

    Movie:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: Orbital Drift }
        description: { type: string, example: A salvage crew finds something alive in a derelict station. }
        poster_url: { type: string, format: uri, example: "https://picsum.photos/seed/orbital/400/600" }
        duration_minutes: { type: integer, example: 128 }
        genres: { type: array, items: { type: string }, example: [Sci-Fi, Thriller] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MovieInput:
      type: object
      required: [title, duration_minutes]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: Dune Runner }
        description: { type: string, maxLength: 5000, example: A courier races across a desert planet. }
        poster_url: { type: string, format: uri, example: "https://picsum.photos/seed/dune/400/600" }
        duration_minutes: { type: integer, minimum: 1, maximum: 600, example: 135 }
        genres:
          type: array
          maxItems: 10
          description: Unknown genres are created automatically
          items: { type: string }
          example: [Sci-Fi, Adventure]

    Hall:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Hall 1 }
        capacity: { type: integer, example: 100 }

    HallInput:
      type: object
      required: [name, rows, seats_per_row]
      properties:
        name: { type: string, example: IMAX }
        rows: { type: integer, minimum: 1, maximum: 26, example: 12 }
        seats_per_row: { type: integer, minimum: 1, maximum: 50, example: 20 }
        premium_rows: { type: integer, minimum: 0, description: The last N rows are premium (1.5× price), example: 3 }

    Showtime:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        movie_id: { type: integer, format: int64, example: 1 }
        movie_title: { type: string, example: Orbital Drift }
        poster_url: { type: string }
        duration_minutes: { type: integer, example: 128 }
        hall_id: { type: integer, format: int64, example: 1 }
        hall_name: { type: string, example: Hall 1 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, description: start + runtime + turnaround buffer }
        price_cents: { type: integer, example: 1200 }
        status: { type: string, enum: [scheduled, cancelled] }

    ShowtimeInput:
      type: object
      required: [movie_id, hall_id, starts_at, price_cents]
      properties:
        movie_id: { type: integer, format: int64, example: 1 }
        hall_id: { type: integer, format: int64, example: 1 }
        starts_at: { type: string, format: date-time, example: "2030-01-15T18:00:00Z" }
        price_cents: { type: integer, minimum: 0, example: 1300 }

    Slot:
      type: object
      properties:
        id: { type: integer, format: int64 }
        hall_id: { type: integer, format: int64 }
        hall_name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        price_cents: { type: integer }

    DaySchedule:
      type: object
      properties:
        date: { type: string, format: date, example: "2026-11-08" }
        timezone: { type: string, example: UTC }
        movies:
          type: array
          items:
            type: object
            properties:
              movie_id: { type: integer, format: int64 }
              title: { type: string }
              poster_url: { type: string }
              duration_minutes: { type: integer }
              showtimes: { type: array, items: { $ref: "#/components/schemas/Slot" } }

    Seat:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        row: { type: string, example: A }
        number: { type: integer, example: 1 }
        type: { type: string, enum: [standard, premium] }
        price_cents: { type: integer, example: 1200 }
        status: { type: string, enum: [available, held, held_by_you, booked] }

    SeatMap:
      type: object
      properties:
        showtime: { $ref: "#/components/schemas/Showtime" }
        capacity: { type: integer, example: 100 }
        available: { type: integer, example: 97 }
        seats: { type: array, items: { $ref: "#/components/schemas/Seat" } }

    SeatsInput:
      type: object
      required: [seat_ids]
      properties:
        seat_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: integer, format: int64 }
          example: [1, 2]

    Hold:
      type: object
      properties:
        showtime_id: { type: integer, format: int64, example: 1 }
        seat_ids: { type: array, items: { type: integer, format: int64 }, example: [1, 2] }
        expires_at: { type: string, format: date-time }

    ReserveInput:
      type: object
      required: [showtime_id, seat_ids]
      properties:
        showtime_id: { type: integer, format: int64, example: 1 }
        seat_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: integer, format: int64 }
          example: [1, 2]

    SeatLine:
      type: object
      properties:
        seat_id: { type: integer, format: int64 }
        row: { type: string, example: A }
        number: { type: integer, example: 1 }
        price_cents: { type: integer, example: 1200 }

    Reservation:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: integer, format: int64 }
        showtime_id: { type: integer, format: int64 }
        movie_title: { type: string, example: Orbital Drift }
        hall_name: { type: string, example: Hall 1 }
        starts_at: { type: string, format: date-time }
        status: { type: string, enum: [confirmed, cancelled] }
        total_cents: { type: integer, example: 2400 }
        seats: { type: array, items: { $ref: "#/components/schemas/SeatLine" } }
        created_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time, nullable: true }

    Page:
      type: object
      properties:
        limit: { type: integer, example: 20 }
        offset: { type: integer, example: 0 }

    ShowtimeStat:
      type: object
      properties:
        showtime_id: { type: integer, format: int64 }
        movie_title: { type: string }
        hall_name: { type: string }
        starts_at: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, cancelled] }
        capacity: { type: integer, example: 100 }
        seats_sold: { type: integer, example: 42 }
        seats_available: { type: integer, example: 58 }
        occupancy_pct: { type: number, example: 42.0 }
        revenue_cents: { type: integer, example: 54600 }

    Bucket:
      type: object
      properties:
        movie_id: { type: integer, format: int64 }
        movie_title: { type: string }
        day: { type: string, format: date }
        showtimes: { type: integer }
        capacity: { type: integer }
        seats_sold: { type: integer }
        occupancy_pct: { type: number }
        revenue_cents: { type: integer }

    Summary:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timezone: { type: string }
        totals: { $ref: "#/components/schemas/Bucket" }
        cancelled_reservations: { type: integer }
        by_movie: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
        by_day: { type: array, items: { $ref: "#/components/schemas/Bucket" } }

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Create an account
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupInput" }
      responses:
        "201":
          description: Account created (role `user`)
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and get a JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me:
    get:
      tags: [Auth]
      summary: Current user
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The authenticated user
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /genres:
    get:
      tags: [Catalogue]
      summary: List genres
      operationId: listGenres
      responses:
        "200":
          description: All genres
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Genre" } }

  /movies:
    get:
      tags: [Catalogue]
      summary: Browse and search movies
      operationId: listMovies
      parameters:
        - { name: genre, in: query, schema: { type: string }, example: Thriller, description: Filter by genre (case-insensitive) }
        - { name: q, in: query, schema: { type: string }, description: Title search }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of movies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Movie" } }

  /movies/{id}:
    get:
      tags: [Catalogue]
      summary: Movie details
      operationId: getMovie
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The movie
          content: { application/json: { schema: { $ref: "#/components/schemas/Movie" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /halls:
    get:
      tags: [Catalogue]
      summary: List halls
      operationId: listHalls
      responses:
        "200":
          description: All halls
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Hall" } }

  /showtimes:
    get:
      tags: [Showtimes]
      summary: Movies and their showtimes for a day
      description: Grouped by movie. Uses the theater timezone and is cached in Redis for 60 s (invalidated when the schedule changes).
      operationId: daySchedule
      parameters:
        - name: date
          in: query
          description: Defaults to today in the theater timezone
          schema: { type: string, format: date }
      responses:
        "200":
          description: The schedule
          content: { application/json: { schema: { $ref: "#/components/schemas/DaySchedule" } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /showtimes/{id}:
    get:
      tags: [Showtimes]
      summary: Showtime details
      operationId: getShowtime
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The showtime
          content: { application/json: { schema: { $ref: "#/components/schemas/Showtime" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /showtimes/{id}/seats:
    get:
      tags: [Showtimes]
      summary: Live seat map
      description: Combines booked seats from Postgres with held seats from Redis. Send a token to see your own holds as `held_by_you`.
      operationId: seatMap
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Seat map with per-seat status and price
          content: { application/json: { schema: { $ref: "#/components/schemas/SeatMap" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /showtimes/{id}/holds:
    post:
      tags: [Booking]
      summary: Hold seats while checking out
      description: All requested seats are held atomically for `SEAT_HOLD_TTL` (5 min by default), or none of them are. Holding again refreshes the timer.
      operationId: holdSeats
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SeatsInput" } } }
      responses:
        "201":
          description: Seats held
          content: { application/json: { schema: { $ref: "#/components/schemas/Hold" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /showtimes/{id}/holds/release:
    post:
      tags: [Booking]
      summary: Release your holds
      operationId: releaseHolds
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SeatsInput" } } }
      responses:
        "204": { description: Released (only holds you own are touched) }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /reservations:
    post:
      tags: [Booking]
      summary: Confirm a reservation
      description: |
        Books the seats in one transaction. Prices are snapshotted per seat (premium seats cost 1.5×).
        Send an `Idempotency-Key` so retries are safe: a repeated key returns the original booking
        with status `200` and the header `Idempotent-Replayed: true`.
      operationId: createReservation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 100 }
          example: 3f1c2b8e-booking-1
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReserveInput" } } }
      responses:
        "201":
          description: Reservation created
          content: { application/json: { schema: { $ref: "#/components/schemas/Reservation" } } }
        "200":
          description: Idempotent replay of an earlier request
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ["true"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Reservation" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      tags: [Booking]
      summary: My reservations
      operationId: listMyReservations
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [upcoming, past] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of reservations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Reservation" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /reservations/{id}:
    get:
      tags: [Booking]
      summary: Reservation details
      operationId: getReservation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ReservationId" }]
      responses:
        "200":
          description: The reservation
          content: { application/json: { schema: { $ref: "#/components/schemas/Reservation" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reservations/{id}/cancel:
    post:
      tags: [Booking]
      summary: Cancel an upcoming reservation
      description: Allowed until `CANCELLATION_CUTOFF` (30 min by default) before the showtime starts. The seats become available again immediately.
      operationId: cancelReservation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ReservationId" }]
      responses:
        "200":
          description: Cancelled
          content: { application/json: { schema: { $ref: "#/components/schemas/Reservation" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/users:
    get:
      tags: [Admin · Users]
      summary: List users
      operationId: adminListUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{id}/role:
    patch:
      tags: [Admin · Users]
      summary: Promote or demote a user
      description: Admins cannot demote themselves. The new role applies from the user's next login.
      operationId: adminSetRole
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleInput" } } }
      responses:
        "200":
          description: Updated user
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/movies:
    post:
      tags: [Admin · Catalogue]
      summary: Add a movie
      operationId: adminCreateMovie
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MovieInput" } } }
      responses:
